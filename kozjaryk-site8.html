<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kozjaryk — улица вслух, на вашем языке</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ========== Theme tokens (light / dark / high contrast) ========== */
:root{
  --bg:#fbfbfd;--panel:#f5f5f7;--ink:#1d1d1f;--muted:#5c5c61;--line:#d2d2d7;--navbg:rgba(251,251,253,.86);
  --blue:#0071e3;--sun:#ffb800;--sky:#3cc6e8;--focus:#ffb800;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#1d1d1f;--ink:#f5f5f7;--muted:#a1a1a6;--line:#424245;--navbg:rgba(22,22,23,.86)}}
:root[data-theme="dark"]{--bg:#000;--panel:#1d1d1f;--ink:#f5f5f7;--muted:#a1a1a6;--line:#424245;--navbg:rgba(22,22,23,.86)}
:root[data-hc="1"][lang]{--bg:#000;--panel:#000;--ink:#fff;--muted:#fff;--line:#fff;--navbg:#000;--blue:#ffd400;--focus:#00e5ff}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-padding-bottom:120px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display",Inter,"Segoe UI",Helvetica,Arial,sans-serif;font-size:calc(21px*var(--z,1));line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:60}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.w{max-width:980px;margin:0 auto}.c{text-align:center}
.skip{position:absolute;left:-9999px;top:8px;background:var(--sun);color:#1d1d1f;padding:10px 16px;border-radius:10px;z-index:100;font-weight:700}
.skip:focus{left:12px}

/* ========== Header ========== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:21px;letter-spacing:-.01em;color:inherit;text-decoration:none}
.logo i{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--sky) 45%,#0b4560)}
.langs{display:flex;gap:6px}
.langs button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:16px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ========== Shared ========== */
section{padding:clamp(64px,9vw,112px) 22px}
h1,h2,h3{font-weight:700}
h2{font-size:clamp(30px,5vw,52px);letter-spacing:-.03em;line-height:1.08;margin:0 0 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 30px;border-radius:999px;border:0;font:inherit;font-size:20px;font-weight:600;text-decoration:none;cursor:pointer;background:var(--blue);color:#fff}
.btn.alt{background:transparent;color:#f5f5f7;box-shadow:inset 0 0 0 2px #f5f5f7}
:root[data-hc="1"][lang] .btn{color:#000}
.btn:hover{filter:brightness(1.1)}
.dk{background:#000;color:#f5f5f7}

/* ========== Hero ========== */
.hero{background:#000;color:#f5f5f7;overflow:hidden;padding-bottom:0}
.hero h1{font-size:clamp(38px,8vw,88px);letter-spacing:-.04em;line-height:1.04;max-width:13ch;margin:0 auto 20px;background:linear-gradient(90deg,#fff 10%,#9be6f8 55%,#ffd36a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(19px,2.4vw,25px);color:#b3b3b8;max-width:34ch;margin:0 auto 32px}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.orbwrap{perspective:900px;height:clamp(280px,46vw,440px);margin-top:48px;position:relative}
.orb{position:absolute;left:50%;top:6%;width:min(78vw,480px);aspect-ratio:1;margin-left:calc(min(78vw,480px)/-2);border-radius:50%;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;
  background:radial-gradient(circle at 36% 28%,#e6fbff 0,#3cc6e8 22%,#0b4560 55%,#02080c 80%);box-shadow:0 0 130px rgba(60,198,232,.45),inset 0 0 90px rgba(0,0,0,.6);animation:float 7s ease-in-out infinite}
.orb::before{content:"";position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.18) 85%,transparent 100%);animation:spin 9s linear infinite}
.lens{position:absolute;left:50%;top:30%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffeeb8,#ffb800 45%,#6b4300);box-shadow:0 0 50px rgba(255,184,0,.9)}
.ring{position:absolute;left:50%;top:30%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,184,0,.55);border-radius:50%;animation:pulse 4.5s ease-out infinite}
.ring:nth-of-type(2){animation-delay:1.5s}.ring:nth-of-type(3){animation-delay:3s}
@keyframes pulse{to{width:92%;opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{translate:0 -12px}}

/* ========== Demo ========== */
.demo{background:#0b0b0d;color:#f5f5f7}
.stage{max-width:860px;margin:0 auto;background:#1d1d1f;border-radius:32px;overflow:hidden;text-align:left}
.stage svg{display:block;width:100%;height:auto}
.scene{filter:blur(10px);transition:filter .9s ease}
.stage.clear .scene{filter:blur(0)}
.tag{opacity:0;transition:opacity .4s}.tag.on{opacity:1}
.hint{margin:0;padding:18px 24px 0;color:var(--sky);font-size:17px}
.qs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px 0}
.qs button,.pill{background:#2c2c2e;color:#f5f5f7;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-size:18px;cursor:pointer}
.qs button:hover,.qs button[aria-pressed="true"]{background:var(--sun);color:#1d1d1f}
.pill:hover{background:var(--blue)}
.answer{margin:0;padding:18px 24px;min-height:112px;font-size:calc(24px*var(--z,1));line-height:1.35;font-weight:600}
.bracelet{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 24px 8px}
.cuff{display:flex;gap:6px;padding:6px;border-radius:999px;background:#000;border:1px solid #3a3a3c}
.seg{min-width:84px;text-align:center;padding:8px 12px;border-radius:999px;color:#a1a1a6;font-size:15px;line-height:1.2}
.seg b{display:block;font-size:20px}
.seg.on{background:var(--sun);color:#1d1d1f;animation:buzz .12s linear 6}
@keyframes buzz{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(0)}}
#bst{margin:0;color:var(--sun);font-size:17px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 24px 0}
#sp{margin:0;padding:10px 24px 0;color:var(--sun);font-size:18px;min-height:1em}
.cap{margin:0;padding:14px 24px 22px;color:#a1a1a6;font-size:16px}

/* ========== Product ========== */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--panel);border-radius:28px;padding:clamp(28px,4vw,48px);min-height:280px}
.card h3{font-size:clamp(28px,3.4vw,38px);letter-spacing:-.02em;margin:0 0 10px}
.card p{margin:0;color:var(--muted);font-size:1.05em}
.vis{height:80px;margin-bottom:30px}
.pend{width:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--sky) 35%,#0b4560 80%);box-shadow:0 8px 30px rgba(60,198,232,.45)}
.band{position:relative;width:160px;border-radius:40px;background:linear-gradient(145deg,#3a3a3c,#0c0c0e)}
.band i{position:absolute;right:22px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--sun);box-shadow:0 0 14px var(--sun)}

/* ========== Join ========== */
form{display:grid;gap:16px;max-width:560px;margin:0 auto;text-align:left}
.f{display:grid;gap:6px;font-weight:600;min-width:0}
input[name],select{width:100%;min-width:0;font:inherit;font-size:1em;padding:14px 16px;border-radius:14px;border:1px solid #48484a;background:#1d1d1f;color:#fff;min-height:54px}
input[aria-invalid="true"]{border-color:#ff6b61}
.chk{display:flex;gap:12px;align-items:flex-start}
.chk input{width:24px;height:24px;margin-top:4px;flex:none}
.lk{background:none;border:0;padding:0;font:inherit;color:#2997ff;text-decoration:underline;cursor:pointer}
.err{color:#ff6b61;min-height:1.5em;font-size:18px}
.ok{max-width:560px;margin:24px auto 0;background:#f5f5f7;color:#1d1d1f;padding:22px;border-radius:20px;text-align:left}
.ok:focus{outline:3px solid var(--focus)}
footer{padding:32px 22px 140px;color:var(--muted);font-size:17px;border-top:1px solid var(--line)}

/* ========== Privacy modal ========== */
dialog{width:min(560px,calc(100vw - 32px));border:1px solid var(--line);border-radius:24px;padding:28px;background:var(--bg);color:var(--ink);font-size:calc(19px*var(--z,1))}
dialog::backdrop{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog h2{font-size:28px;margin:0 0 14px}
dialog p{color:var(--muted);margin:0 0 14px}
dialog .btn{min-height:52px;margin-top:6px}

/* ========== Accessibility bar ========== */
.a11y{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;gap:8px;padding:8px;background:var(--navbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:opacity .3s ease,transform .3s ease,visibility .3s}
.a11y.hide{opacity:0;visibility:hidden;transform:translate(-50%,16px)}
.a11y button{min-height:52px;min-width:52px;padding:0 22px;border-radius:999px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font:inherit;font-size:22px;font-weight:700;cursor:pointer}
.a11y button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.hw{max-width:640px;margin:24px auto 0;text-align:left;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
.hw summary{cursor:pointer;font-weight:600}
.hw p{margin:10px 0 0;color:var(--muted)}
.chk input{min-height:0;padding:0}
textarea{font:inherit;font-size:1em;padding:14px 16px;border-radius:14px;border:1px solid #48484a;background:#1d1d1f;color:#fff;width:100%;min-width:0;resize:vertical}
fieldset.of{border:0;padding:0;margin:0;display:grid;gap:10px}
fieldset.of legend{font-weight:600;padding:0;margin-bottom:6px}
.pform{max-width:600px}.pform .lk{color:var(--blue)}.pform .err{color:#c62d22}
.exl{color:#a1a1a6;font-size:17px;margin-right:4px}.ex{padding-top:14px}
.how .nd{fill:#2c2c2e;stroke:#48484a;stroke-width:2;transition:fill .4s,stroke .4s}
.how .ln{fill:none;stroke:#48484a;stroke-width:3;stroke-dasharray:6 8}
.how text{fill:#f5f5f7;font:700 34px Inter,Arial,sans-serif}
.how .lensc{fill:var(--sun)}
.how .wave{fill:none;stroke:#48484a;stroke-width:3;stroke-linecap:round}
.how[data-s="0"] .n0,.how[data-s="1"] .n1,.how[data-s="2"] .n2,.how[data-s="3"] .n3{fill:#3a3a3c;stroke:var(--sun)}
.how[data-s="0"] .l0,.how[data-s="1"] .l1,.how[data-s="2"] .l1{stroke:var(--sun);animation:dash 1s linear infinite}
.how[data-s="2"] .wave{stroke:var(--sun)}
.how[data-s="3"] .n3{animation:buzz .12s linear 12}
@keyframes dash{to{stroke-dashoffset:-28}}
.how svg{width:100%;max-width:860px;height:auto;display:block;margin:28px auto 0}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:860px;margin:20px auto 0}
.steps4 button{background:#1d1d1f;color:#f5f5f7;border:2px solid transparent;border-radius:20px;padding:14px;font:inherit;font-size:17px;text-align:left;cursor:pointer;min-height:84px}
.steps4 button[aria-pressed="true"]{border-color:var(--sun)}
.hctl{margin-top:16px}
.quotes{display:grid;gap:16px;max-width:760px;margin:0 auto}
blockquote{margin:0;background:var(--panel);border-radius:24px;padding:28px;text-align:left}
blockquote p{margin:0 0 10px;font-size:1.15em}
cite{color:var(--muted);font-style:normal}
.hh{margin:12px 0 0;font-size:1.05em}.hlist{margin:6px 0 0;padding-left:1.2em;color:var(--muted)}
.hcol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
dialog ul{margin:0 0 14px;padding-left:1.2em;color:var(--muted)}dialog li{margin-bottom:8px}
@media (max-width:760px){.steps4{grid-template-columns:1fr 1fr}.hcol{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.how .ln,.how .n3{animation:none}}
.card.sm{min-height:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.card.wide{grid-column:1/-1;min-height:0}
.price{max-width:640px;margin:28px auto 0;color:var(--muted);font-size:1.02em}
.btn.ghost{background:transparent;color:#2997ff;box-shadow:none;min-height:48px;font-size:18px;padding:0 18px}
:root[data-hc="1"][lang] .btn.alt,:root[data-hc="1"][lang] .btn.ghost{color:#fff}
.gmsg{margin:12px 0 0;color:var(--sun);font-size:18px;min-height:1.2em}
.vwrap{aspect-ratio:16/9;max-width:860px;margin:0 auto;border-radius:28px;overflow:hidden;background:#000}
.vwrap iframe{width:100%;height:100%;border:0}
#partners p{color:var(--muted);max-width:44ch;margin:0 auto 28px}
@media (max-width:760px){.cards{grid-template-columns:1fr}.a11y{gap:6px;padding:6px}.a11y button{min-height:48px;min-width:48px;padding:0 16px;font-size:20px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.orb,.orb::before,.ring,.seg.on{animation:none}.ring{opacity:0}.scene,.tag,.a11y,.orb{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#demo" data-i="a11y.skip"></a>

<header class="top"><div class="in">
  <a class="logo" href="#top"><i></i>Kozjaryk</a>
  <div class="langs" id="langs" role="group" data-ia="a11y.lang">
    <button type="button" data-l="kk" aria-pressed="false">ҚАЗ</button>
    <button type="button" data-l="ru" aria-pressed="true">РУС</button>
    <button type="button" data-l="en" aria-pressed="false">ENG</button>
  </div>
</div></header>

<main id="top">

<!-- 1. HERO -->
<section class="hero c"><div class="w">
  <h1 data-i="hero.h1"></h1>
  <p class="sub" data-i="hero.sub"></p>
  <div class="cta">
    <a class="btn" href="#demo" data-i="hero.demo"></a>
    <a class="btn alt" href="#join" data-i="hero.join"></a>
    <button type="button" class="btn ghost" id="guide" data-i="hero.guide"></button>
    <button type="button" class="btn ghost" id="helpb" data-i="hero.help" aria-haspopup="dialog"></button>
  </div>
  <p class="gmsg" id="gmsg" role="status" aria-live="polite"></p>
  <div class="orbwrap" aria-hidden="true">
    <div class="orb" id="orb"><span class="lens"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span></div>
  </div>
</div></section>

<!-- 2. DEMO -->
<section class="demo c" id="demo"><div class="w">
  <h2 data-i="demo.h2"></h2>
  <div class="stage" id="stage">
    <svg viewBox="0 0 400 250" role="img" data-ia="demo.svg" aria-describedby="svd">
      <g class="scene">
        <rect width="400" height="250" fill="#2a6f91"/>
        <rect y="196" width="400" height="54" fill="#2f4a56"/>
        <rect x="14" y="36" width="190" height="166" fill="#e7d3a3"/>
        <rect x="24" y="50" width="170" height="32" rx="6" fill="#0b7a5a"/>
        <text x="109" y="72" font-size="15" font-weight="700" text-anchor="middle" fill="#fff" font-family="Verdana,sans-serif">ДӘРІХАНА · АПТЕКА</text>
        <rect x="36" y="110" width="48" height="92" fill="#7a4a2b"/>
        <rect x="108" y="112" width="72" height="44" fill="#bfe6f7"/>
        <rect x="222" y="104" width="164" height="84" rx="12" fill="#e0a21b"/>
        <rect x="232" y="116" width="34" height="26" fill="#bfe6f7"/><rect x="274" y="116" width="34" height="26" fill="#bfe6f7"/><rect x="316" y="116" width="34" height="26" fill="#bfe6f7"/>
        <rect x="232" y="84" width="48" height="18" rx="4" fill="#1d1d1f"/>
        <text x="256" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#ffb800" font-family="Verdana,sans-serif">92</text>
        <circle cx="258" cy="190" r="13" fill="#1d1d1f"/><circle cx="352" cy="190" r="13" fill="#1d1d1f"/>
        <rect x="150" y="214" width="100" height="26" rx="4" fill="#7fb77e"/>
        <text x="200" y="233" font-size="15" font-weight="700" text-anchor="middle" fill="#1d3b1c" font-family="Verdana,sans-serif">5000 ₸</text>
      </g>
      <g fill="none" stroke="#ffb800" stroke-width="3">
        <rect class="tag" data-k="door" x="32" y="106" width="56" height="100"/>
        <rect class="tag" data-k="sign" x="20" y="46" width="178" height="40"/>
        <rect class="tag" data-k="bus" x="218" y="80" width="172" height="114"/>
        <rect class="tag" data-k="note" x="146" y="210" width="108" height="34"/>
      </g>
    </svg>
    <p class="sr" id="svd" data-i="demo.desc"></p>
    <p class="hint" data-i="demo.hint"></p>
    <div class="qs" id="qs" role="group" data-ia="demo.qlabel">
      <button type="button" data-q="0" aria-pressed="false" data-i="demo.q1"></button>
      <button type="button" data-q="1" aria-pressed="false" data-i="demo.q2"></button>
      <button type="button" data-q="2" aria-pressed="false" data-i="demo.q3"></button>
      <button type="button" data-q="3" aria-pressed="false" data-i="demo.q4"></button>
      <button type="button" data-q="4" aria-pressed="false" data-i="demo.q5"></button>
    </div>
    <p class="answer" id="ans" aria-live="polite"><span id="anst"></span> <span class="sr" id="svs"></span></p>
    <div class="bracelet">
      <div class="cuff" id="cuff" aria-hidden="true">
        <div class="seg" data-d="l"><b>◀</b><span data-i="demo.bl"></span></div>
        <div class="seg" data-d="s"><b>■</b><span data-i="demo.bs"></span></div>
        <div class="seg" data-d="r"><b>▶</b><span data-i="demo.br"></span></div>
      </div>
      <p id="bst" aria-live="polite"></p>
    </div>
    <div class="actions" role="group" data-ia="demo.str"><span class="exl" data-i="demo.str"></span><button type="button" class="pill" data-sg="0" aria-pressed="false" data-i="demo.s1"></button><button type="button" class="pill" data-sg="1" aria-pressed="true" data-i="demo.s2"></button><button type="button" class="pill" data-sg="2" aria-pressed="false" data-i="demo.s3"></button></div>
    <div class="actions"><button type="button" class="pill" id="speak" data-i="demo.speak"></button></div>
    <div class="actions ex" role="group" data-ia="demo.ex"><span class="exl" data-i="demo.ex"></span><button type="button" class="pill" data-ex="kk">Қазақша</button><button type="button" class="pill" data-ex="ru">Русский</button><button type="button" class="pill" data-ex="en">English</button></div>
    <p id="sp" role="status" aria-live="polite"></p>
    <p class="cap" data-i="demo.cap"></p>
  </div>
</div></section>

<!-- Concept animation: how the pendant, AI, voice and bracelet work together -->
<section class="dk c" id="how"><div class="w">
  <h2 data-i="how.h2"></h2>
  <div class="how" id="how-box" data-s="0">
    <svg viewBox="0 0 800 200" aria-hidden="true">
      <g class="nd n0"><circle cx="90" cy="100" r="46"/><circle class="lensc" cx="90" cy="100" r="14"/></g>
      <path class="ln l0" d="M150 100H320"/>

  "help": {

   "g": "Or press “Listen to the site guide”: a voice explains how everything works here."

  "off": {

 }

<script>
(function(){
"use strict";
/* ================= CONFIG: fill these in before launch ================= */
var ENDPOINT="";      /* URL of a Google Apps Script web app / Telegram-bot relay / Formspree. Empty = demo mode (data stays in this browser) */
var VIDEO_ID="";      /* YouTube video id of the real demo video. Empty = video block stays hidden */
var CONTACT_EMAIL=""; /* contact for personal-data requests; replaces the placeholder in the privacy policy */
var STORIES=[];     /* real testing quotes only, e.g. [{q:{ru:"...",kk:"...",en:"..."},who:{ru:"Участник теста, 62 года",kk:"...",en:"..."}}]. Empty = section hidden */
var OPERATOR="Инициативная группа проекта Kozjaryk, Казахстан"; /* who controls the data. Before collecting real data replace with a registered operator, e.g. "ТОО «…», БИН …", or a named responsible person, and have a lawyer review the policy */
/* ======================================================================= */
var I=JSON.parse(document.getElementById("i18n").textContent);
var L="ru",Q=-1;
var VOICE={ru:"ru-RU",kk:"kk-KZ",en:"en-US"};
var DIR=["l","s","r","s","s"],TAGS=[["door","bus"],["sign"],["bus"],["note"],[]];
function $(i){return document.getElementById(i)}
function g(path){var o=I[L];path.split(".").forEach(function(k){o=o==null?o:o[k]});return o==null?"":o}
function sv(k,v){try{localStorage.setItem("kj_"+k,v)}catch(e){}}
function ld(k){try{return localStorage.getItem("kj_"+k)}catch(e){return null}}

/* ---------- language ---------- */
function pickLang(){
  var ls=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""]).map(function(x){return String(x).toLowerCase().split(/[-_]/)[0]});
  if(ls.indexOf("kk")>-1)return "kk";
  for(var i=0;i<ls.length;i++){if(ls[i]==="ru"||ls[i]==="en")return ls[i]}
  var tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  return /^Asia\/(Almaty|Aqtau|Aqtobe|Atyrau|Oral|Qostanay|Qyzylorda)$/.test(tz)?"ru":"en";
}
function setLang(l){
  L=l;document.documentElement.lang=l;document.title=g("title");
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=g(e.dataset.i)});
  document.querySelectorAll("[data-ia]").forEach(function(e){e.setAttribute("aria-label",g(e.dataset.ia))});
  document.querySelectorAll("#langs button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===l)});
  var po=$("polop");po.textContent=OPERATOR?g("pol.op").replace("{op}",OPERATOR):"";po.hidden=!OPERATOR;
  if(ENDPOINT)$("polp1").textContent=g("pol.p1s");
  if(CONTACT_EMAIL){var p1=$("polp1");p1.textContent=p1.textContent.replace(/\[[^\]]*email[^\]]*\]/i,CONTACT_EMAIL)}
  applyZ();renderDemo();hLabel();renderStories();sv("lang",l);
}
$("langs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setLang(b.dataset.l)});

/* ---------- demo ---------- */
var stage=$("stage"),ans=$("ans"),bst=$("bst"),sp=$("sp");
function renderDemo(){
  var segs=document.querySelectorAll(".seg");
  if(Q<0){
    $("anst").textContent=g("demo.idle");$("svs").textContent="";bst.textContent=g("demo.bw");
    segs.forEach(function(s){s.classList.remove("on")});return;
  }
  stage.classList.toggle("clear",Q!==4); /* the cautious answer keeps the scene blurred */
  document.querySelectorAll(".tag").forEach(function(r){r.classList.toggle("on",TAGS[Q].indexOf(r.dataset.k)>-1)});
  $("anst").textContent=g("demo.a"+(Q+1));$("svs").textContent=g("demo.h"+(Q+1));
  var d=DIR[Q],label="";
  segs.forEach(function(s){var on=s.dataset.d===d;s.classList.remove("on");if(on){void s.offsetWidth;s.classList.add("on");label=s.querySelector("span").textContent}});
  bst.textContent=g("demo.bst")+": "+label;
}
$("qs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  Q=+b.dataset.q;sp.textContent="";
  this.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
  renderDemo();
  haptic(DIR[Q]);
});

/* ---------- bracelet feedback: vibration where supported, quiet sound pulses elsewhere (iOS has no Vibration API) ---------- */
var SGs=ld("sg"),SG=SGs===null?1:Math.min(2,Math.max(0,+SGs||0)),AC=null;
function haptic(d){
  var kf=[0.7,1,1.6][SG],pat=(d==="l"?[120,80,120]:d==="r"?[120,80,120,80,120]:[400]).map(function(x){return Math.round(x*kf)});
  try{if(navigator.vibrate&&navigator.vibrate(pat))return}catch(e){}
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    AC=AC||new Ctx();if(AC.state==="suspended")AC.resume();
    var pan=AC.createStereoPanner?AC.createStereoPanner():null,dest=pan||AC.destination;
    if(pan){pan.pan.value=d==="l"?-1:d==="r"?1:0;pan.connect(AC.destination)}
    var t0=AC.currentTime+.02,at=0;
    pat.forEach(function(ms,i){
      if(i%2===0){
        var s=t0+at/1000,e=s+ms/1000,o=AC.createOscillator(),gn=AC.createGain();
        o.type="sine";o.frequency.value=170;
        var gv=.12*[.6,1,1.6][SG];gn.gain.setValueAtTime(0,s);gn.gain.linearRampToValueAtTime(gv,s+.01);gn.gain.setValueAtTime(gv,e-.02);gn.gain.linearRampToValueAtTime(0,e);
        o.connect(gn);gn.connect(dest);o.start(s);o.stop(e+.02);
      }
      at+=ms;
    });
  }catch(e){}
}

/* vibration strength selector (remembered) */
function applySG(){document.querySelectorAll("[data-sg]").forEach(function(b){b.setAttribute("aria-pressed",+b.dataset.sg===SG?"true":"false")})}
document.querySelectorAll("[data-sg]").forEach(function(b){b.addEventListener("click",function(){SG=+b.dataset.sg;sv("sg",SG);applySG();haptic(Q>=0?DIR[Q]:"l")})});
applySG();

/* ---------- speech (voices load asynchronously, esp. Safari/iOS) ---------- */
var VC=[],haveSpeech="speechSynthesis" in window;
function loadVoices(){try{VC=speechSynthesis.getVoices()||[]}catch(e){VC=[]}return VC}
if(haveSpeech){
  loadVoices();
  if(speechSynthesis.addEventListener)speechSynthesis.addEventListener("voiceschanged",loadVoices);
  else speechSynthesis.onvoiceschanged=loadVoices;
}
function whenVoices(cb){
  if(loadVoices().length){cb();return}
  var done=false,tm;
  function fin(){if(!done){done=true;clearTimeout(tm);loadVoices();cb()}}
  tm=setTimeout(fin,2000);
  if(speechSynthesis.addEventListener)speechSynthesis.addEventListener("voiceschanged",function h(){speechSynthesis.removeEventListener("voiceschanged",h);fin()});
  else speechSynthesis.onvoiceschanged=fin;
}
/* say(): speaks txt in the chosen language; if the device has no voice for it, falls back to the Russian text/voice */
function say(txt,lang,msgEl,ruTxt){
  msgEl.textContent="";
  if(!haveSpeech){msgEl.textContent=g("demo.nosp");return}
  whenVoices(function(){
    function find(l){return VC.filter(function(v){return v.lang.toLowerCase().replace("_","-").indexOf(VOICE[l].slice(0,2))===0})}
    var use=lang,text=txt,mv=find(lang);
    if(VC.length&&!mv.length&&lang!=="ru"&&ruTxt){var rv=find("ru");if(rv.length){use="ru";text=ruTxt;mv=rv;msgEl.textContent=g("demo.nov2")}}
    if(VC.length&&!mv.length){msgEl.textContent=g("demo.nov");return}
    var u=new SpeechSynthesisUtterance(text);u.lang=VOICE[use];
    try{if(mv.length)u.voice=mv[0]}catch(e){}
    u.onerror=function(){msgEl.textContent=g("demo.err")};
    speechSynthesis.cancel();speechSynthesis.speak(u);
  });
}
$("speak").addEventListener("click",function(){
  sp.textContent="";
  if(Q<0){sp.textContent=g("demo.ask");return}
  var k="a"+(Q+1);say(g("demo."+k),L,sp,I.ru.demo[k]);
});
$("guide").addEventListener("click",function(){say(g("guide.text"),L,$("gmsg"),I.ru.guide.text)});

/* ---------- accessibility: text size + contrast ---------- */
var Zs=[1,1.15,1.3],ZL=["A","A+","A++"],zi=+ld("z")||0,zb=$("zm"),hb=$("hc");
function applyZ(){
  document.documentElement.style.setProperty("--z",Zs[zi]);
  zb.textContent=ZL[zi];zb.setAttribute("aria-label",g("a11y.size")+": "+ZL[zi]);
}
zb.addEventListener("click",function(){zi=(zi+1)%3;sv("z",zi);applyZ()});
function applyHC(on){
  if(on)document.documentElement.setAttribute("data-hc","1");else document.documentElement.removeAttribute("data-hc");
  hb.setAttribute("aria-pressed",on?"true":"false");
}
hb.addEventListener("click",function(){var on=hb.getAttribute("aria-pressed")!=="true";applyHC(on);sv("hc",on?1:0)});

/* the bar fades out near the footer and while the form is in use */
var bar=$("a11y"),F=$("wl"),fs={f:false,i:false};
function updBar(){bar.classList.toggle("hide",fs.f||fs.i)}
if("IntersectionObserver" in window){new IntersectionObserver(function(es){fs.f=es[0].isIntersecting;updBar()}).observe(document.querySelector("footer"))}
[F,$("pf")].forEach(function(f){
  f.addEventListener("focusin",function(){fs.i=true;updBar()});
  f.addEventListener("focusout",function(){setTimeout(function(){fs.i=F.contains(document.activeElement)||$("pf").contains(document.activeElement);updBar()},60)});
});

/* ---------- modals (privacy policy, site help): focus always returns to the opener ---------- */
function wireDialog(d,openers,closeBtn){
  var last=null;
  function open(o){last=o;if(d.showModal)d.showModal();else d.setAttribute("open","");closeBtn.focus()}
  function close(){if(d.close)d.close();else{d.removeAttribute("open");if(last)last.focus()}}
  openers.forEach(function(o){o.addEventListener("click",function(){open(o)})});
  closeBtn.addEventListener("click",close);
  d.addEventListener("click",function(e){var r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()});
  d.addEventListener("close",function(){if(last)last.focus()});
}
wireDialog($("pol"),[$("polb"),$("polb2")],$("polx"));
wireDialog($("help"),[$("helpb")],$("helpx"));

/* ---------- waitlist form ---------- */
if(VIDEO_ID){$("vf").src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(VIDEO_ID);$("vid").hidden=false}
$("partnerbtn").addEventListener("click",function(e){e.preventDefault();var d=$("pdet");d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"});$("pf").org.focus({preventScroll:true})});
var E=$("err");
function bad(el,m){el.setAttribute("aria-invalid","true");E.textContent=m;el.focus()}
F.addEventListener("submit",function(e){
  e.preventDefault();
  if(F.website.value)return; /* honeypot: bots fill hidden fields */
  var nm=F.nm.value.trim(),em=F.em.value.trim();E.textContent="";
  [F.nm,F.em,F.ag].forEach(function(x){x.removeAttribute("aria-invalid")});
  if(nm.length<2)return bad(F.nm,g("join.en"));
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return bad(F.em,g("join.ee"));
  if(!F.ag.checked)return bad(F.ag,g("join.ea"));
  var list=[];try{list=JSON.parse(ld("wl")||"[]")}catch(x){}
  var rec={n:nm,e:em,r:F.rl.selectedIndex,t:Date.now()};
  list.push(rec);sv("wl",JSON.stringify(list));
  function done(msg){F.hidden=true;var o=$("okb");o.hidden=false;o.textContent=msg;o.focus()}
  if(!ENDPOINT){done(g("join.ok").replace("{n}",nm).replace("{c}",list.length));return}
  var sb=F.querySelector("button[type=submit]");sb.disabled=true;
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"waitlist",name:nm,email:em,role:F.rl.value,lang:L,ts:rec.t})})
    .then(function(){done(g("join.ok2").replace("{n}",nm))})
    .catch(function(){sb.disabled=false;E.textContent=g("join.neterr")});
});

/* ---------- audio examples: any language, regardless of the site language ---------- */
document.querySelectorAll("[data-ex]").forEach(function(b){
  b.addEventListener("click",function(){var l=b.dataset.ex;say(I[l].demo.a1,l,sp,I.ru.demo.a1)});
});

/* ---------- concept animation (pause control + manual steps, starts paused with reduced motion) ---------- */
var hbox=$("how-box"),hplay=$("hplay"),hs=0,hOn=!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches),htimer=null;
function hLabel(){hplay.textContent=g(hOn?"how.pause":"how.play")}
function setStep(i){hs=i;hbox.dataset.s=i;document.querySelectorAll("#steps4 button").forEach(function(b,k){b.setAttribute("aria-pressed",k===i?"true":"false")})}
function hRun(){clearInterval(htimer);if(hOn)htimer=setInterval(function(){setStep((hs+1)%4)},2600)}
hplay.addEventListener("click",function(){hOn=!hOn;hLabel();hRun()});
$("steps4").addEventListener("click",function(e){var b=e.target.closest("button");if(b){setStep(+b.dataset.st);hRun()}});
hRun();

/* ---------- testing stories (only real quotes from CONFIG) ---------- */
function renderStories(){
  var box=$("quotes");box.textContent="";
  $("stories").hidden=!STORIES.length;
  STORIES.forEach(function(x){
    var b=document.createElement("blockquote"),p=document.createElement("p"),c=document.createElement("cite");
    p.textContent=(x.q&&(x.q[L]||x.q.ru))||"";c.textContent=(x.who&&(x.who[L]||x.who.ru))||"";
    b.appendChild(p);b.appendChild(c);box.appendChild(b);
  });
}

/* ---------- partner questionnaire ---------- */
var PF=$("pf"),PE=$("perr");
function pbad(el,m){el.setAttribute("aria-invalid","true");PE.textContent=m;el.focus()}
PF.addEventListener("submit",function(e){
  e.preventDefault();if(PF.website.value)return;PE.textContent="";
  var org=PF.org.value.trim(),em=PF.pem.value.trim();
  [PF.org,PF.pem,PF.pag].forEach(function(x){x.removeAttribute("aria-invalid")});
  if(org.length<2)return pbad(PF.org,g("part.eo"));
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return pbad(PF.pem,g("join.ee"));
  if(!PF.pag.checked)return pbad(PF.pag,g("join.ea"));
  var offers=[].slice.call(PF.querySelectorAll("input[name=of]:checked")).map(function(x){return x.value});
  var rec={type:"partner",org:org,orgType:PF.ot.value,offers:offers,email:em,message:PF.pm.value.trim(),lang:L,ts:Date.now()};
  var list=[];try{list=JSON.parse(ld("pl")||"[]")}catch(x){}
  list.push(rec);sv("pl",JSON.stringify(list));
  function done(){PF.hidden=true;var o=$("pok");o.hidden=false;o.textContent=g("part.ok").replace("{n}",org);o.focus()}
  if(!ENDPOINT){done();return}
  var sb=PF.querySelector("button[type=submit]");sb.disabled=true;
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
    .then(done).catch(function(){sb.disabled=false;PE.textContent=g("join.neterr")});
});

/* ---------- orb: gentle 3D tilt ---------- */
var orb=$("orb"),calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!calm){
  window.addEventListener("pointermove",function(e){
    var x=(e.clientX/window.innerWidth-.5),y=(e.clientY/window.innerHeight-.5);
    orb.style.setProperty("--ry",(x*18)+"deg");orb.style.setProperty("--rx",(-y*14)+"deg");
  },{passive:true});
}

/* ---------- init ---------- */
applyHC(ld("hc")==="1");
setLang(ld("lang")||pickLang());
})();
</script>
